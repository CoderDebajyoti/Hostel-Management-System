<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hostel Management System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/app.js" defer></script>
</head>

<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="../index.html">HostelHub</a>
      <nav class="nav-links">
        <a href="./services.html">Services</a>
        <a href="./about.html">About</a>
        <a href="./contact.html">Contact</a>
        <a href="./login.html">Login / Register</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card container">
      <h1>Welcome back</h1>
      <p>Sign in to manage your bookings and room details.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <label for="loginEmail">Email address</label>
        <input id="loginEmail" type="email" name="email" placeholder="Enter your email" required />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" name="password" placeholder="Enter your password" required />

        <button type="submit" class="button button-primary">Login</button>
      </form>

      <p class="auth-switch">
        No account? <a href="./register.html">Create one here</a>
      </p>
    </div>
  </main>

    <footer>
        <p>&copy; 2026 Hostel Management System. All rights reserved.</p>
    </footer>
</body>

</html>
